<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Request for Leave</title>

    <!-- Bootstrap + Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<!-- Topbar -->
<div class="topbar">
    <h5 class="mb-0 fw-bold">Employee MS</h5>

    <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">
            Welcome, <span th:text="${employeeName}"></span>
        </span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid px-5 pt-4">

        <div class="card shadow-sm border-0 p-4 mx-auto"
             style="max-width: 950px; border-radius: 12px;">

            <h4 class="fw-bold mb-4">Request for Leave</h4>

            <form th:action="@{/employee/apply-leave}" method="post" th:object="${leaveRequest}">

            <!-- Leave Type -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Leave Type</label>
                    <select class="form-select" th:field="*{leaveType}" required>
                        <option value="">Select Leave Type</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Annual Leave">Annual Leave</option>
                    </select>
                </div>

                <!-- Dates -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">From Date</label>
                        <input type="date" class="form-control" th:field="*{fromDate}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">To Date</label>
                        <input type="date" class="form-control" th:field="*{toDate}" required>
                    </div>
                </div>

                <!-- Reason -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" rows="4"
                              th:field="*{reason}" placeholder="Reason" required></textarea>
                </div>

                <!-- Button -->
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                    Apply Leave
                </button>

            </form>

        </div>

    </div>
</div>

</body>
</html>
