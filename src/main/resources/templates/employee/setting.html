<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Setting</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<!-- Topbar -->
<div class="topbar">
    <h5 class="mb-0 fw-bold">Employee MS</h5>

    <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">
            Welcome, <span th:text="${employeeName}"></span>
        </span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div class="container mt-5" style="max-width:650px;">

        <div class="card shadow p-5">

                <h4 class="fw-bold text-center mb-4">Change Password</h4>

                <!-- Success Message -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                <!-- Error Message -->
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/employee/change-password}" method="post">

                    <!-- Old Password -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Old Password</label>
                        <input type="password" name="oldPassword" class="form-control"
                               placeholder="Old Password" required>
                    </div>

                    <!-- New Password -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" id="newPassword" name="newPassword"
                               class="form-control" placeholder="New Password" required>
<!--                        <small id="pwdRule" class="text-muted d-none">-->
                        <small id="pwdRule" class="text-danger d-none">
                            Password must be 8+ characters with 1 uppercase, 1 number & 1 special character.
                        </small>


                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" name="confirmPassword" class="form-control"
                               placeholder="Confirm Password" required>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                        Change Password
                    </button>

                </form>

            </div>
        </div>
    </div>

</body>
//show/hide rule
<script>
    const newPwd = document.getElementById("newPassword");
    const rule = document.getElementById("pwdRule");

    newPwd.addEventListener("focus", () => {
        rule.classList.remove("d-none");   // show
    });

    newPwd.addEventListener("blur", () => {
        // hide again only if empty
        if (newPwd.value.trim() === "") {
            rule.classList.add("d-none");
        }
    });
</script>

</html>
