<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="employee-panel">

<div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

    <!-- Topbar -->
    <div class="topbar">
        <h5 class="mb-0 fw-bold">Employee MS</h5>

        <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">
            Welcome, <span th:text="${employeeName}"></span>
        </span>
            <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
        </div>
    </div>

    <!-- Main -->
    <div class="main">

        <!-- Header -->
        <div th:replace="fragments/header :: header"></div>

        <!-- Content -->
        <div class="main-content">

            <div class="card welcome-card">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <div>
                        <h5 class="mb-0">Welcome Back</h5>
                        <h4 class="fw-bold" th:text="${employeeName}"></h4>
                    </div>
                </div>
            </div>

            <div class="row mt-4 g-3">
                <div class="col-md-6">
                    <div class="card shadow-sm p-4 d-flex align-items-center flex-row gap-3">
                        <div class="icon-box bg-success text-white">
                            <i class="bi bi-calendar-check fs-2"></i>
                        </div>
                        <div>
                        <h6>Total Leaves</h6>
                        <h2 th:text="${totalLeaves}">0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm p-4 d-flex align-items-center flex-row gap-3">
                        <div class="icon-box bg-primary text-white">
                            <i class="bi bi-cash-stack fs-2"></i>
                        </div>
                        <div>
                        <h6>Total Salary Records</h6>
                        <h2 th:text="${totalSalaryRecords}">0</h2>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
