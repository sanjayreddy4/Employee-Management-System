<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Leaves</title>

    <!-- Bootstrap + Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<!-- Topbar -->
<div class="topbar">
    <h5 class="mb-0 fw-bold">Employee MS</h5>

    <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">
            Welcome, <span th:text="${employeeName}"></span>
        </span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid mt-4 px-5">

        <!--  FULL WIDTH CARD -->
        <div class="card shadow-sm border-0 p-4"
             style="border-radius: 14px; width: 100%; max-width: 1100px; margin: auto;">

            <!--  TITLE CENTER -->
            <h3 class="fw-bold text-center mb-4">Manage Leaves</h3>

            <!--  SEARCH LEFT + ADD BUTTON RIGHT -->
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

                <!-- LEFT SEARCH -->
                <form th:action="@{/employee/leaves}" method="get" id="searchForm">
                    <input type="text"
                           name="status"
                           placeholder="Search by status"
                           class="form-control w-100"
                           onkeyup="autoSearch()">

                </form>

                <!-- RIGHT ADD BUTTON -->
                <div>
                    <a th:href="@{/employee/apply-new-leave}" class="btn btn-success px-4">
                        <i class="bi bi-plus-circle me-1"></i> Add Leave
                    </a>

                    </a>
                </div>
            </div>


            <div class="table-responsive mt-2">
                <table class="table table-hover align-middle mb-0">

                    <thead style="background-color:#0aa57f; color:white;">
                    <tr>
                        <th style="width: 70px;">Sno</th>
                        <th>Leave type</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Description</th>
                        <th>Applied date</th>
                        <th style="width: 120px;">Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="leave, iter : ${leaves}">
                        <td th:text="${iter.count}"></td>
                        <td th:text="${leave.leaveType}"></td>
                        <td th:text="${leave.fromDate}"></td>
                        <td th:text="${leave.toDate}"></td>
                        <td th:text="${leave.reason}"></td>
                        <td th:text="${leave.appliedDate}"></td>

                        <td>
                            <span class="badge bg-warning text-dark px-3 py-2"
                                  th:if="${leave.status=='Pending'}">Pending</span>

                            <span class="badge bg-success px-3 py-2"
                                  th:if="${leave.status=='Approved'}">Approved</span>

                            <span class="badge bg-danger px-3 py-2"
                                  th:if="${leave.status=='Rejected'}">Rejected</span>
                        </td>
                    </tr>

                    <!-- Empty -->
                    <tr th:if="${#lists.isEmpty(leaves)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No leave requests found
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

            <!--  PAGINATION -->
            <div class="d-flex justify-content-center align-items-center gap-3 mt-4">

                <!-- Prev -->
                <a class="btn btn-outline-secondary px-3"
                   th:href="@{/employee/leaves(page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0} ? 'disabled'">
                    ◀
                </a>

                <!-- Page indicator -->
                <span class="page-indicator"
                      style="background:#f1f5f9; font-weight:600;">
                    Page <span th:text="${currentPage + 1}"></span>
                    /
                    <span th:text="${totalPages}"></span>
                </span>

                <!-- Next -->
                <a class="btn btn-outline-secondary px-3"
                   th:href="@{/employee/leaves(page=${currentPage + 1})}"
                   th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                     ▶
                </a>

            </div>

        </div>
    </div>
</div>

</body>
</html>
