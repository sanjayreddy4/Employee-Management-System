<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Salary</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<!-- Topbar -->
<div class="topbar">
    <h5 class="mb-0 fw-bold">Employee MS</h5>

    <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">Welcome, <span th:text="${employeeName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
    </div>
</div>

<!-- Main content -->
<div class="main-content">
    <div class="container-fluid mt-4 px-5">

        <div class="card shadow-sm border-0 p-4"
             style="border-radius: 14px; width: 100%; max-width: 1100px; margin:auto;">

            <h3 class="fw-bold text-center mb-4">Salary History</h3>

<!--            &lt;!&ndash; Search box (optional UI only) &ndash;&gt;-->
<!--            <div class="d-flex justify-content-end mb-3">-->
<!--                <div class="input-group" style="max-width: 260px;">-->
<!--                    <input type="text" class="form-control" placeholder="Search By Pay Date" disabled>-->
<!--                    <button class="btn btn-success" disabled>-->
<!--                        <i class="bi bi-search"></i>-->
<!--                    </button>-->
<!--                </div>-->
<!--            </div>-->

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead style="background-color:#0aa57f; color:white;">
                    <tr>
                        <th style="width:70px;">Sr.No</th>
                        <th>Salary</th>
                        <th>Allowance</th>
                        <th>Deduction</th>
                        <th>Total</th>
                        <th>Pay Date</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="s, iter : ${salaries}">
                        <td th:text="${iter.count}"></td>
                        <td th:text="${s.basicSalary}"></td>
                        <td th:text="${s.allowances}"></td>
                        <td th:text="${s.deductions}"></td>
                        <td th:text="${s.totalSalary}"></td>
                        <td th:text="${s.payDate}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(salaries)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No salary records found
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center align-items-center gap-3 mt-4">

                <a class="btn btn-outline-secondary px-3"
                   th:href="@{/employee/salary(page=${currentPage-1})}"
                   th:classappend="${currentPage == 0} ? 'disabled'">
                    ◀
                </a>

                <span class="page-indicator"
                      style="background:#f1f5f9; font-weight:600;">
                    Page <span th:text="${currentPage+1}"></span> /
                    <span th:text="${totalPages}"></span>
                </span>

                <a class="btn btn-outline-secondary px-3"
                   th:href="@{/employee/salary(page=${currentPage+1})}"
                   th:classappend="${currentPage+1 == totalPages} ? 'disabled'">
                    ▶
                </a>

            </div>

        </div>
    </div>
</div>

</body>
</html>
