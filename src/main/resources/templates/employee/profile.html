<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>

    <!-- Bootstrap + Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<!-- Topbar -->
<div class="topbar">
    <h5 class="mb-0 fw-bold">Employee MS</h5>

    <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">
            Welcome, <span th:text="${employeeName}"></span>
        </span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
    </div>
</div>

<!-- Main content -->
<div class="main-content">

    <!-- Profile Card Center -->
    <div class="d-flex justify-content-center align-items-start mt-4">

        <div class="card shadow-lg border-0 p-4" style="width: 900px; border-radius: 12px;">
            <h3 class="text-center fw-bold mb-4">
                Employee <span style="color:#0aa57f;">Details</span>
            </h3>

            <div class="row align-items-center">

                <!-- Left: Photo -->
                <div class="col-md-5 text-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                         alt="profile"
                         style="width: 250px; height: 180px; object-fit: cover; border-radius: 12px; background: #e8f5f1;">
                </div>

                <!-- Right: Details -->
                <div class="col-md-7">

                    <p class="mb-2">
                        <span class="badge bg-primary p-2">Name:</span>
                        <span class="ms-2 fw-semibold" th:text="${employee.name}">Employee</span>
                    </p>

                    <p class="mb-2">
                        <span class="badge bg-primary p-2">Employee ID:</span>
                        <span class="ms-2 fw-semibold" th:text="${employee.id}">101</span>
                    </p>

                    <p class="mb-2">
                        <span class="badge bg-primary p-2">Email:</span>
                        <span class="ms-2 fw-semibold" th:text="${employee.email}">abc@gmail.com</span>
                    </p>

                    <p class="mb-2">
                        <span class="badge bg-primary p-2">Department:</span>
                        <span class="ms-2 fw-semibold" th:text="${employee.department?.name}">IT</span>

                    </p>

                    <p class="mb-2">
                        <span class="badge bg-primary p-2">Mobile:</span>
                        <span class="ms-2 fw-semibold" th:text="${employee.phone}">9999999999</span>
                    </p>

                    <p class="mb-0">
                        <span class="badge bg-primary p-2">Gender:</span>
                        <span class="ms-2 fw-semibold" th:text="${employee.gender}">Male</span>
                    </p>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
