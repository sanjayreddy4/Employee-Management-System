<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<div class="main-content">
    <div class="container mt-4">

        <div class="card shadow p-4">
            <h4 class="text-center mb-4">Add Employee</h4>

            <form th:action="@{/employees/save}"
                  th:object="${employee}"
                  method="post">

                <!-- hidden id -->
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <!-- Name -->
                    <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control"
                               th:field="*{name}" placeholder="Enter name" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               th:field="*{email}" placeholder="Enter email" required>
                    </div>

                    <!-- Employee Code (optional UI field) -->
                    <div class="col-md-6">
                        <label class="form-label">Employee Code</label>
                        <input type="text" class="form-control"
                               placeholder="EMP001">
                    </div>

                    <!-- Date of Birth -->
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control"
                               th:field="*{dob}">
                    </div>

                    <!-- Gender -->
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select class="form-control" th:field="*{gender}">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <!-- Department -->
                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <select class="form-control" th:field="*{department.id}">
                            <option value="">-- Select Department --</option>
                            <option th:each="d : ${departments}"
                                    th:value="${d.id}"
                                    th:text="${d.name}">
                            </option>
                        </select>
                    </div>

                    <!-- Designation -->
                    <div class="col-md-6">
                        <label class="form-label">Designation</label>
                        <input type="text" class="form-control"
                               th:field="*{designation}" placeholder="Developer">
                    </div>

                    <!-- Salary -->
                    <div class="col-md-6">
                        <label class="form-label">Salary</label>
                        <input type="number" class="form-control"
                               th:field="*{salary}" placeholder="Enter salary">
                    </div>

                </div>

                <!-- Buttons -->
                <div class="text-center mt-4">
                    <button class="btn btn-success px-5">Add Employee</button>
                </div>

            </form>
        </div>

    </div>
</div>

</body>
</html>
