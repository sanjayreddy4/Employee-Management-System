<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page">

<div class="container vh-100">
    <div class="row h-100 align-items-center justify-content-center">

        <!-- LEFT SIDE (FORM) -->
        <div class="col-md-5 d-flex justify-content-end">
            <div class="login-card">

                <h3 class="text-center mb-2">Employee Management System</h3>
                <p class="text-center text-muted mb-4">Login to continue</p>

                <!-- Error -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Invalid username or password
                </div>

                <!-- Logout -->
                <div th:if="${param.logout}" class="alert alert-success">
                    Logged out successfully
                </div>

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                   <!-- <div class="mb-3">
                        <label class="form-label">Login As</label>
                        <select name="role" class="form-select">
                            <option value="ADMIN">Admin</option>
                            <option value="EMPLOYEE">Employee</option>
                        </select>
                    </div>-->

                    <button class="btn btn-login w-100">Login</button>

                </form>
            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="col-md-5">
            <div class="right-content text-center text-white">
                <h1 class="fw-bold mb-3">Welcome Back!</h1>
                <p class="mb-4">
                    Manage employees, track performance and organize your workplace efficiently.
                </p>

                <img th:src="@{/css/images/login.png}" class="login-img">
            </div>
        </div>

    </div>
</div>

</body>
</html>
