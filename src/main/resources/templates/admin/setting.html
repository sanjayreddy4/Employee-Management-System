<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Setting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">

        <!-- HEADER -->
        <div th:replace="fragments/header :: header"></div>

        <div class="main-content">

            <div class="container mt-5" style="max-width:650px;">

                <div class="card shadow p-5">

                    <h4 class="text-center fw-bold mb-4">Change Password</h4>

                    <!-- SUCCESS MESSAGE -->
                    <div th:if="${success}" class="alert alert-success text-center fw-semibold">
                        <span th:text="${success}"></span>
                    </div>

                    <!-- ERROR MESSAGE -->
                    <div th:if="${error}" class="alert alert-danger text-center fw-semibold">
                        <span th:text="${error}"></span>
                    </div>


                    <form th:action="@{/admin/setting/change-password}" method="post">

                        <div class="mb-3">
                            <label class="fw-semibold">Old Password</label>
                            <input type="password" class="form-control" name="oldPassword"
                                   placeholder="Old Password" required>
                        </div>

                        <div class="mb-3">
                            <label class="fw-semibold">New Password</label>
                            <input type="password" id="newPassword" name="newPassword"
                                   class="form-control" placeholder="New Password" required>
<!--                            <small id="pwdRule" class="text-muted d-none">-->
                            <small id="pwdRule" class="text-danger d-none">
                                Password must be 8+ characters with 1 uppercase, 1 number & 1 special character.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" name="confirmPassword"
                                   placeholder="Confirm Password" required>
                        </div>

                        <!-- Button -->
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                            Change Password
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

</body>

<script>
    const newPwd = document.getElementById("newPassword");
    const rule = document.getElementById("pwdRule");

    newPwd.addEventListener("focus", () => {
        rule.classList.remove("d-none"); // show
    });

    newPwd.addEventListener("blur", () => {
        if (newPwd.value.trim() === "") {
            rule.classList.add("d-none"); // hide again if empty
        }
    });
</script>

</html>
