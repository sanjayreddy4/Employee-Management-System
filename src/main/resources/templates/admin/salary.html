<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Salary</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- MAIN -->
    <div class="flex-grow-1">

        <!-- HEADER -->
        <div th:replace="fragments/header :: header"></div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="container-fluid mt-4 px-5">

                <h3 class="text-center fw-bold mb-4">Manage Salary</h3>

                <!-- SEARCH + ADD BUTTON -->
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

                    <!-- SEARCH -->
                    <form th:action="@{/admin/salary}" method="get" class="d-flex" style="max-width:280px;">
                        <input type="text"
                               name="keyword"
                               placeholder="Search by Emp ID or Name"
                               class="form-control w-100"
                               th:value="${keyword}">
                    </form>

                    <!-- ADD BUTTON -->
                    <a class="btn btn-success px-4 py-2 fw-semibold"
                       th:href="@{/admin/salary/add}">
                        + Add Salary
                    </a>
                </div>

                <!-- TABLE CARD -->
                <div class="card table-card p-3 shadow-sm">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="text-white" style="background:#0aa57f;">
                            <tr>
                                <th>Sr. No</th>
                                <th>Emp ID</th>
                                <th>Emp Name</th>
                                <th>Department</th>
                                <th>Basic</th>
                                <th>Allowances</th>
                                <th>Deductions</th>
                                <th>Total Salary</th>
                                <th>Pay Date</th>
                                <th class="text-center">Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="s, stat : ${list}">
                                <td th:text="${stat.index + 1}"></td>
                                <td th:text="${s.empId}"></td>
                                <td th:text="${s.empName}"></td>
                                <td th:text="${s.deptName}"></td>
                                <td th:text="${s.basicSalary}"></td>
                                <td th:text="${s.allowances}"></td>
                                <td th:text="${s.deductions}"></td>
                                <td th:text="${s.totalSalary}"></td>
                                <td th:text="${s.payDate}"></td>

                                <td class="text-center">
                                    <a th:href="@{/admin/salary/delete/{id}(id=${s.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete?')">
                                        Delete
                                    </a>
                                </td>
                            </tr>

                            <!-- EMPTY -->
                            <tr th:if="${#lists.isEmpty(list)}">
                                <td colspan="10" class="text-center text-danger fw-bold py-3">
                                    No Salary Records Found
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>

                    <!--  PAGINATION -->
                    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                        <a class="btn btn-outline-secondary px-3 py-2 fw-bold"
                           th:href="@{/admin/salary(page=${currentPage - 1}, keyword=${keyword})}"
                           th:classappend="${currentPage == 0} ? 'disabled'">
                            ◀
                        </a>

                        <span class="page-indicator">
                            Page <span th:text="${currentPage + 1}"></span>
                            /
                            <span th:text="${totalPages}"></span>
                        </span>

                        <a class="btn btn-outline-secondary px-3 py-2 fw-bold"
                           th:href="@{/admin/salary(page=${currentPage + 1}, keyword=${keyword})}"
                           th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                            ▶
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
