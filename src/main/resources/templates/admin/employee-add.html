<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/admin-sidebar :: sidebar"></div>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="container mt-4" style="max-width:600px">
        <div class="card shadow p-4">

            <h4 class="text-center mb-4">Add Employee</h4>

            <form th:action="@{/admin/employees/save}"
                  th:object="${employee}"
                  method="post"
                  enctype="multipart/form-data">
<!--               file upload field-->

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>

                    <div class="col-md-6">
                        <label>Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>

                    <div class="col-md-6">
                        <label>Phone Number</label>
                        <input type="text" class="form-control"
                               th:field="*{phone}"
                               placeholder="Enter phone number"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>
                    </div>


                    <div class="col-md-6">
                        <label>Employee ID</label>
                        <input type="text" class="form-control" th:field="*{employeeCode}">
                    </div>

                    <div class="col-md-6">
                        <label>Date of Birth</label>
                        <input type="date" class="form-control" th:field="*{dob}">
                    </div>

                    <div class="col-md-6">
                        <label>Gender</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Marital Status</label>
                        <select class="form-select" th:field="*{maritalStatus}">
                            <option value="">Select Status</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Department</label>
                        <select class="form-select" th:field="*{department.id}">
                            <option value="">-- Select Department --</option>
                            <option th:each="d : ${departments}"
                                    th:value="${d.id}"
                                    th:text="${d.name}">
                            </option>
                        </select>

                    </div>

                    <div class="col-md-6">
                        <label>Designation</label>
                        <input type="text" class="form-control" th:field="*{designation}">
                    </div>

                    <div class="col-md-6">
                        <label>Salary</label>
                        <input type="number" class="form-control" th:field="*{salary}">
                    </div>

                    <div class="col-md-6">
                        <label>Password</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                    </div>

                    <div class="col-md-6">
                        <label>Role</label>
                        <select class="form-select" th:field="*{role}">
                            <option value="">Select Role</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="EMPLOYEE">EMPLOYEE</option>
                        </select>
                    </div>

                </div>

                <div class="d-grid mt-4">
                    <button class="btn btn-success">Add Employee</button>
                </div>

            </form>


        </div>
    </div>
</div>

</body>
</html>
