<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Salary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- MAIN -->
    <div class="flex-grow-1">

        <!-- HEADER -->
        <div th:replace="fragments/header :: header"></div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="container-fluid mt-4 px-5">

                <h3 class="fw-bold mb-4">Add New Salary</h3>

                <!-- CARD -->
                <div class="card shadow-sm p-4" style="max-width: 950px;">

                    <form th:action="@{/admin/salary/save}" method="post" th:object="${salary}">

                    <div class="row g-4">

                            <!-- Department -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Department</label>
                                <select class="form-select" id="deptSelect" th:field="*{departmentId}" required>
                                <option value="">Select Department</option>
                                    <option th:each="d : ${departments}"
                                            th:value="${d.id}"
                                            th:text="${d.name}">
                                    </option>
                                </select>
                            </div>

                            <!-- Employee -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Employee</label>
                                <select class="form-select" id="empSelect" th:field="*{empId}" required>
                                    <option value="">Select Employee</option>
<!--                                <option th:each="e : ${employees}"-->
<!--                                            th:value="${e.id}"-->
<!--                                            th:text="${e.name}">-->
<!--                                    </option>-->
                                </select>
                            </div>

                            <!-- Basic Salary -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Basic Salary</label>
                                <input type="number" step="0.01" class="form-control"
                                       placeholder="Enter Basic Salary"
                                       th:field="*{basicSalary}" required>
                            </div>

                            <!-- Allowances -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Allowances</label>
                                <input type="number" step="0.01" class="form-control"
                                       placeholder="Monthly Allowances"
                                       th:field="*{allowances}" required>
                            </div>

                            <!-- Deductions -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Deductions</label>
                                <input type="number" step="0.01" class="form-control"
                                       placeholder="Monthly Deductions"
                                       th:field="*{deductions}" required>
                            </div>

                            <!-- Pay Date -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Pay Date</label>
                                <input type="date" class="form-control"
                                       th:field="*{payDate}" required>
                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="mt-4 d-flex gap-3">
                            <button type="submit" class="btn btn-success px-5 w-70">
                                Add Salary
                            </button>

                            <a th:href="@{/admin/salary}" class="btn btn-outline-secondary px-5">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </div>
        </div>

    </div>
</div>

</body>

<script>
    const deptSelect = document.getElementById("deptSelect");
    const empSelect = document.getElementById("empSelect");

    deptSelect.addEventListener("change", function () {

        const deptId = this.value;

        // reset employee dropdown
        empSelect.innerHTML = `<option value="">Select Employee</option>`;

        if (!deptId) return;

        fetch(`/admin/salary/employees/${deptId}`)
            .then(response => response.json())
            .then(data => {
                data.forEach(emp => {
                    const option = document.createElement("option");
                    option.value = emp.id;
                    option.textContent = emp.name;
                    empSelect.appendChild(option);
                });
            })
            .catch(error => console.log("Error loading employees:", error));
    });
</script>

</html>
