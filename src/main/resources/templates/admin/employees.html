<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>


    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">

        <!-- HEADER -->
        <div th:replace="fragments/header :: header"></div>

        <div class="main-content">
           <div class="container-fluid mt-4 px-5">

            <h4 class="mb-4 text-center">Manage Employees</h4>

            <!-- SEARCH + ADD BUTTON -->
            <div class="d-flex justify-content-between align-items-center mb-3">

                <form th:action="@{/admin/employees/search}" method="get" id="searchForm">
                    <input type="text"
                           name="keyword"
                           placeholder="Search by ID or Name"
                           class="form-control w-100"
                           onkeyup="autoSearch()">
                </form>

                <a class="btn btn-success px-4 py-2 fw-semibold"
                   th:href="@{/admin/employees/add}">
                    + Add New Employee
                </a>
            </div>

            <!-- TABLE CARD -->
            <div class="card table-card p-3">
                <table class="table align-middle mb-0">
                    <thead class="text-white" style="background:#0aa57f;">
                    <tr>
                        <th>Sr. No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Salary</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="emp, stat : ${list}">
                        <td th:text="${stat.index + 1}"></td>
                        <td th:text="${emp.name}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:text="${emp.department != null ? emp.department.name : 'Not Assigned'}"></td>
                        <td th:text="${emp.designation}"></td>
                        <td th:text="${emp.salary}"></td>

                        <td class="text-center">
                            <a th:href="@{/admin/employees/view/{id}(id=${emp.id})}"
                               class="btn btn-primary btn-sm">View</a>

                            <a th:href="@{/admin/employees/edit/{id}(id=${emp.id})}"
                               class="btn btn-warning btn-sm">Edit</a>

                            <a th:href="@{/admin/employees/delete/{id}(id=${emp.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete?')">Delete</a>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(list)}">
                        <td colspan="6" class="text-center text-danger fw-semibold">
                            No employees found
                        </td>
                    </tr>
                    </tbody>
                </table>


                <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                    <button class="btn btn-outline-secondary"
                            th:disabled="${currentPage == 0}"
                            onclick="changePage(-1)">
                        ◀
                    </button>

                    <span class="page-indicator">
                    Page <span th:text="${currentPage + 1}"></span>
                    /
                    <span th:text="${totalPages}"></span>
                    </span>

                    <button class="btn btn-outline-secondary"
                            th:disabled="${currentPage + 1 == totalPages}"
                            onclick="changePage(1)">
                        ▶
                    </button>
                </div>

            </div>
               </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    function changePage(direction) {
        let current = [[${currentPage}]];
        let nextPage = current + direction;

        window.location.href = "/admin/employees?page=" + nextPage;
    }

    function autoSearch() {
        document.getElementById("searchForm").submit();
    }
</script>


</body>
</html>
