<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Leave</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<div class="flex-grow-1">

<div th:replace="fragments/header :: header"></div>

<div class="main-content">
    <div class="container-fluid mt-4 px-5">

        <div class="card shadow-sm border-0 p-4 mx-auto"
             style="border-radius: 14px; max-width: 700px;">

            <h3 class="fw-bold text-center mb-4">Leave Details</h3>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="fw-semibold">Employee ID</label>
                    <div class="form-control" th:text="${leave.employee.id}"></div>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold">Employee Name</label>
                    <div class="form-control" th:text="${leave.employee.name}"></div>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold">Leave Type</label>
                    <div class="form-control" th:text="${leave.leaveType}"></div>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold">Status</label>
                    <div class="form-control" th:text="${leave.status}"></div>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold">From</label>
                    <div class="form-control" th:text="${leave.fromDate}"></div>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold">To</label>
                    <div class="form-control" th:text="${leave.toDate}"></div>
                </div>

                <div class="col-12">
                    <label class="fw-semibold">Reason</label>
                    <textarea class="form-control" rows="4" readonly
                              th:text="${leave.reason}"></textarea>
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between mt-4">

                <a th:href="@{/admin/leaves}" class="btn btn-secondary px-4">
                    Back
                </a>

                <div class="d-flex gap-2">
                    <form th:action="@{/admin/leaves/reject/{id}(id=${leave.id})}" method="post">
                        <button class="btn btn-danger px-4" type="submit">Reject</button>
                    </form>

                    <form th:action="@{/admin/leaves/approve/{id}(id=${leave.id})}" method="post">
                        <button class="btn btn-success px-4" type="submit">Approve</button>
                    </form>
                </div>
            </div>

        </div>

    </div>
</div>
</div>

</body>
</html>
