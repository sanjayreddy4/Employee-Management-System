<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/admin-sidebar :: sidebar"></div>

<!-- Topbar -->
<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold">Employee MS</h5>

    <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold">Welcome, Admin</span>
        <a th:href="@{/logout}" class="btn btn-light btn-sm">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <h2 class="fw-bold mb-4">Dashboard Overview</h2>

    <!-- Overview Cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card-box">
                <div class="icon bg-success">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div>
                    <h4 th:text="${totalEmployees}">0</h4>
                    <span>Total Employees</span>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box">
                <div class="icon bg-warning text-dark">
                    <i class="bi bi-building"></i>
                </div>
                <div>
                    <h4 th:text="${totalDepartments}">0</h4>
                    <span>Total Departments</span>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box">
                <div class="icon bg-danger">
                    <i class="bi bi-cash-stack"></i>
                </div>
                <div>
                    <h4>₹1900</h4>
                    <span>Monthly Pay</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Leave Details -->
    <h3 class="fw-bold mb-4 mt-3">Leave Details</h3>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card-box">
                <div class="icon bg-info">
                    <i class="bi bi-file-earmark-text-fill"></i>
                </div>
                <div>
                    <h4 th:text="${leaveApplied}">0</h4>
                    <span>Leave Applied</span>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card-box">
                <div class="icon bg-warning text-dark">
                    <i class="bi bi-hourglass-split"></i>
                </div>
                <div>
                    <h4 th:text="${leavePending}">0</h4>
                    <span>Leave Pending</span>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card-box">
                <div class="icon bg-success">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <div>
                    <h4 th:text="${leaveApproved}">0</h4>
                    <span>Leave Approved</span>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card-box">
                <div class="icon bg-danger">
                    <i class="bi bi-x-circle-fill"></i>
                </div>
                <div>
                    <h4 th:text="${leaveRejected}">0</h4>
                    <span>Leave Rejected</span>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
