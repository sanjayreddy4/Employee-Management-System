<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Employee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1">

        <!-- HEADER -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- PAGE CONTENT -->
        <div class="main-content">
            <div class="container mt-2" style="max-width:650px">

                <div class="card shadow p-4 rounded-4">
                    <h4 class="text-center mb-4 fw-bold">Edit Employee</h4>

                    <!-- FORM -->
                    <form th:action="@{/admin/employees/save}"
                          th:object="${employee}"
                          method="post">

                        <!-- IMPORTANT: hidden id for update -->
                        <input type="hidden" th:field="*{id}"/>

                        <!-- NAME -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   required>
                        </div>

                        <!-- EMAIL -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <!-- DEPARTMENT -->
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select"
                                    th:field="*{department}"
                                    required>

                                <option value="">-- Select Department --</option>

                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.name}"
                                        th:selected="${employee.department != null
                                                      and dept.id == employee.department.id}">
                                </option>
                            </select>
                        </div>

                        <!-- DESIGNATION -->
                        <div class="mb-3">
                            <label class="form-label">Designation</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{designation}">
                        </div>

                        <!-- SALARY -->
                        <div class="mb-4">
                            <label class="form-label">Salary</label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{salary}">
                        </div>

                        <!-- BUTTONS -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/employees}"
                               class="btn btn-secondary px-4">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-warning px-4 fw-semibold">
                                Update
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
