<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Departments</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Optional icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">


    <style>
        .page-title {
            font-weight: 600;
            margin-bottom: 20px;
        }
        .action-btn {
            padding: 4px 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="d-flex">
    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- MAIN -->
    <div class="flex-grow-1">

        <!-- HEADER -->
        <div th:replace="fragments/header :: header"></div>

        <div class="main-content">

        <div class="container-fluid px-4 mt-4">

            <!-- TITLE -->
            <h4 class="page-title text-center">Manage Departments</h4>

            <!-- SEARCH + ADD -->
            <div class="d-flex justify-content-between align-items-center mb-3 mt-3">

                <form th:action="@{/admin/departments/search}" method="get" class="d-flex mb-3">
                    <input type="text"
                           name="keyword"
                           placeholder="Search by Department"
                           class="form-control w-100"
                           onkeyup="autoSearch()">
                </form>


                <a class="btn btn-success"
                   th:href="@{/admin/departments/add}">
                    + Add New Department
                </a>

            </div>

            <!-- TABLE -->
            <div class="card table-card p-3">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>S No</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="d, stat : ${list}">
                            <td th:text="${stat.index + 1}"></td>
                            <td th:text="${d.name}"></td>
                            <td>
                                <a th:href="@{/admin/departments/edit/{id}(id=${d.id})}"
                                   class="btn btn-success action-btn">
                                    Edit
                                </a>

                                <a th:href="@{/admin/departments/delete/{id}(id=${d.id})}"
                                   class="btn btn-danger action-btn"
                                   onclick="return confirm('Delete this department?')">
                                    Delete
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(list)}">
                            <td colspan="3" class="text-danger fw-semibold">
                                No departments found
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                        <button class="btn btn-outline-secondary"
                                th:disabled="${currentPage == 0}"
                                onclick="changePage(-1)">
                            ◀
                        </button>

                        <span class="page-indicator">
                            Page <span th:text="${currentPage + 1}"></span>
                                /
                        <span th:text="${totalPages}"></span>
                        </span>

                        <button class="btn btn-outline-secondary"
                                th:disabled="${currentPage + 1 == totalPages}"
                                onclick="changePage(1)">
                            ▶
                        </button>
                    </div>


                </div>
            </div>
        </div>
        </div>
    </div>
</div>

<script>
    function changePage(direction) {
        let current = [[${currentPage}]];
        let nextPage = current + direction;
        window.location.href = "/admin/departments?page=" + nextPage;
    }
</script>

</body>
</html>
